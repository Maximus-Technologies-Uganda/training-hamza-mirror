name: Generate Review Packet

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
    paths:
      - 'docs/review-packet-*.md'

jobs:
  generate-review-packet:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm test -- --coverage

      - name: Install Newman (Postman CLI)
        run: npm install -g newman newman-reporter-htmlextra

      - name: Create review packet directory
        run: mkdir -p review-packet

      - name: Run Postman collection tests
        run: |
          node src/blog/server.js &
          SERVER_PID=$!
          sleep 5
          newman run docs/blog-posts-api.postman_collection.json \
            --environment <(echo '{"id":"test-env","name":"Test","values":[{"key":"baseUrl","value":"http://localhost:3000","enabled":true}]}') \
            --reporters cli,json,htmlextra \
            --reporter-json-export review-packet/postman-results.json \
            --reporter-htmlextra-export review-packet/postman-report.html \
            --color on \
            || echo "Postman tests completed with issues"
          kill $SERVER_PID 2>/dev/null || true
        continue-on-error: true

      - name: Generate Postman summary
        run: |
          if [ -f review-packet/postman-results.json ]; then
            echo "# Postman Test Results" > review-packet/postman-summary.md
            echo "" >> review-packet/postman-summary.md
            echo "**Collection**: Blog Posts API" >> review-packet/postman-summary.md
            echo "**Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> review-packet/postman-summary.md
            echo "" >> review-packet/postman-summary.md
            node -e "
              const fs = require('fs');
              const results = JSON.parse(fs.readFileSync('review-packet/postman-results.json', 'utf8'));
              const run = results.run;
              console.log('## Summary\n');
              console.log('- Total Requests: ' + run.stats.requests.total);
              console.log('- Assertions: ' + run.stats.assertions.total);
              console.log('- Failed Assertions: ' + run.stats.assertions.failed);
              console.log('- Test Scripts: ' + run.stats.testScripts.total);
              console.log('- Failed Tests: ' + run.stats.testScripts.failed);
              console.log('\n## Status: ' + (run.stats.assertions.failed === 0 ? '✅ All tests passed' : '❌ Some tests failed'));
            " >> review-packet/postman-summary.md
            echo "" >> review-packet/postman-summary.md
            echo "See \`postman-report.html\` for detailed results." >> review-packet/postman-summary.md
          else
            echo "⚠️ Postman results not generated" > review-packet/postman-summary.md
          fi
        continue-on-error: true

      - name: Copy documentation
        run: |
          if [ -d docs ]; then
            cp -r docs/* review-packet/
          else
            echo "Warning: docs directory does not exist. Documentation will not be included in the review packet."
          fi
          cp README.md review-packet/ 2>/dev/null || true

      - name: Generate test report
        run: |
          npm test -- --reporter=verbose > review-packet/test-results.txt 2>&1 || true

      - name: Capture git log
        run: |
          git log --oneline --graph --all -20 > review-packet/git-log.txt

      - name: Capture branch info
        run: |
          echo "Branch: $(git branch --show-current)" > review-packet/branch-info.txt
          echo "Commit: $(git rev-parse HEAD)" >> review-packet/branch-info.txt
          echo "Author: $(git log -1 --pretty=format:'%an <%ae>')" >> review-packet/branch-info.txt
          echo "Date: $(git log -1 --pretty=format:'%ad')" >> review-packet/branch-info.txt

      - name: List changed files
        run: |
          git diff --name-only $(git merge-base origin/development HEAD)...HEAD > review-packet/changed-files.txt 2>/dev/null || git diff --name-only $(git rev-list --max-parents=0 HEAD)...HEAD > review-packet/changed-files.txt

      - name: Copy source files
        run: |
          mkdir -p review-packet/src
          if [ -d src ]; then
            cp -r src/* review-packet/src/
          else
            echo "WARNING: src directory does not exist. No source files copied." >&2
          fi
          mkdir -p review-packet/tests
          if [ -d tests ]; then
            cp -r tests/* review-packet/tests/
          else
            echo "WARNING: tests directory does not exist. No test files copied." >&2
          fi
      - name: Create summary
        run: |
          cat << EOF > review-packet/SUMMARY.md
          # Review Packet Summary
          
          **Branch**: $(git branch --show-current)
          **Commit**: $(git rev-parse --short HEAD)
          **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ## Contents
          
          - `docs/` - All documentation and review packets
          - `src/` - Source code for this feature
          - `tests/` - Test files
          - `test-results.txt` - Test execution output
          - `git-log.txt` - Recent git history
          - `branch-info.txt` - Branch and commit details
          - `changed-files.txt` - Files modified in this branch
          - `README.md` - Project documentation
          
          ## Quick Links
          
          - Repository: ${{ github.server_url }}/${{ github.repository }}
          - Branch: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}
          - CI Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload Review Packet
        uses: actions/upload-artifact@v4
        with:
          name: review-packet-feat-hello-cli-1
          path: review-packet/
