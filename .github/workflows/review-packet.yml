name: Generate Review Packet

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - development
    paths:
      - 'docs/review-packet-*.md'
      - 'frontend/**'
      - 'src/**'
      - 'tests/**'

jobs:
  generate-review-packet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Create review packet directory
        run: mkdir -p review-packet/screenshots review-packet/coverage

      # ========================================
      # Backend Tests & Coverage
      # ========================================
      - name: Run backend tests with coverage
        run: npm test -- --coverage
        continue-on-error: true

      - name: Copy backend coverage
        run: |
          mkdir -p review-packet/coverage/backend
          cp -r coverage/* review-packet/coverage/backend/ 2>/dev/null || true
        continue-on-error: true

      # ========================================
      # Frontend Type-check & Build
      # ========================================
      - name: Run TypeScript type-check
        run: npm run type-check
        working-directory: frontend
        continue-on-error: true

      - name: Run Next.js build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}
        continue-on-error: true

      # ========================================
      # Frontend Tests & Coverage
      # ========================================
      - name: Run frontend tests with coverage
        run: npm run test:coverage 2>&1 | tee ../review-packet/frontend-test-output.txt
        working-directory: frontend
        continue-on-error: true

      - name: Debug frontend coverage files
        run: |
          echo "=== Checking frontend coverage directory ==="
          ls -la frontend/coverage/ 2>/dev/null || echo "frontend/coverage/ does not exist"
          echo ""
          echo "=== Looking for coverage-summary.json ==="
          find frontend -name "coverage-summary.json" 2>/dev/null || echo "No coverage-summary.json found"
          echo ""
          echo "=== Coverage directory contents ==="
          find frontend/coverage -type f 2>/dev/null | head -20 || echo "No coverage files found"
        continue-on-error: true

      - name: Generate frontend coverage summary
        run: |
          echo "## Frontend Coverage Summary" > review-packet/coverage-summary.md
          echo "" >> review-packet/coverage-summary.md
          echo "**Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> review-packet/coverage-summary.md
          echo "" >> review-packet/coverage-summary.md
          if [ -f frontend/coverage/coverage-summary.json ]; then
            node -e "
              const summary = require('./frontend/coverage/coverage-summary.json');
              const total = summary.total;
              console.log('| Metric | Coverage | Threshold |');
              console.log('|--------|----------|-----------|');
              console.log('| Statements | ' + total.statements.pct + '% | ≥50% |');
              console.log('| Branches | ' + total.branches.pct + '% | - |');
              console.log('| Functions | ' + total.functions.pct + '% | - |');
              console.log('| Lines | ' + total.lines.pct + '% | ≥45% critical |');
              console.log('');
              const passed = total.statements.pct >= 50;
              console.log('**Status**: ' + (passed ? '✅ Coverage threshold met' : '⚠️ Coverage below 50%'));
            " >> review-packet/coverage-summary.md
            mkdir -p review-packet/coverage/frontend
            cp -r frontend/coverage/* review-packet/coverage/frontend/ 2>/dev/null || true
          else
            echo "⚠️ Frontend coverage data not available" >> review-packet/coverage-summary.md
          fi
        continue-on-error: true

      - name: Run frontend integration tests
        run: npm run test:integration 2>&1 | tee ../review-packet/integration-test-output.txt
        working-directory: frontend
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}

      # ========================================
      # Contract Tests
      # ========================================
      - name: Start API server for contract tests
        run: |
          node src/blog/server.js &
          echo $! > /tmp/api-server.pid
          sleep 5

      - name: Run API contract tests
        run: npm run test:contract 2>&1 | tee review-packet/contract-test-output.txt
        continue-on-error: true

      - name: Stop API server
        run: kill $(cat /tmp/api-server.pid) 2>/dev/null || true
        continue-on-error: true

      # ========================================
      # Playwright E2E & A11y Tests with Screenshots
      # ========================================
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend
        continue-on-error: true

      - name: Start servers for E2E tests
        run: |
          # Start API server on port 3000
          PORT=3000 node src/blog/server.js &
          echo $! > /tmp/api-server.pid
          
          # Wait for API server to be ready (max 30 seconds)
          echo "Waiting for API server on port 3000..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/api/posts > /dev/null 2>&1; then
              echo "✅ API server is ready"
              break
            fi
            echo "  Attempt $i: API server not ready yet..."
            sleep 1
          done
          
          # Start frontend on port 5000 (using production build)
          cd frontend
          npm run build
          npm run start &
          echo $! > /tmp/frontend-server.pid
          cd ..
          
          # Wait for frontend server to be ready (max 60 seconds)
          echo "Waiting for frontend server on port 5000..."
          for i in {1..60}; do
            if curl -s http://localhost:5000 > /dev/null 2>&1; then
              echo "✅ Frontend server is ready"
              break
            fi
            echo "  Attempt $i: Frontend server not ready yet..."
            sleep 1
          done
          
          # Final verification
          echo ""
          echo "=== Server Status ==="
          curl -s http://localhost:3000/api/posts > /dev/null 2>&1 && echo "✅ API server (3000): Running" || echo "❌ API server (3000): Not responding"
          curl -s http://localhost:5000 > /dev/null 2>&1 && echo "✅ Frontend server (5000): Running" || echo "❌ Frontend server (5000): Not responding"
        env:
          PORT: '3000'
          NEXT_PUBLIC_API_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:5000
        continue-on-error: false

      - name: Run Playwright E2E tests (captures screenshots)
        run: npx playwright test --project=chromium 2>&1 | tee ../review-packet/playwright-output.txt || true
        working-directory: frontend
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:5000

      - name: Run Playwright a11y smoke tests
        run: npx playwright test --grep @a11y --project=chromium 2>&1 | tee ../review-packet/a11y-test-output.txt || true
        working-directory: frontend
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:5000

      - name: Capture UI state screenshots
        run: |
          # Capture screenshots using Playwright (run from frontend directory)
          cd frontend && npx playwright test --grep "screenshot" --project=chromium || true
          # Copy any generated screenshots
          cp -r frontend/test-results/* review-packet/screenshots/ 2>/dev/null || true
          cp -r frontend/playwright-report review-packet/ 2>/dev/null || true
        continue-on-error: true
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000
          PLAYWRIGHT_BASE_URL: http://localhost:5000

      - name: Stop servers
        run: |
          kill $(cat /tmp/api-server.pid) 2>/dev/null || true
          kill $(cat /tmp/frontend-server.pid) 2>/dev/null || true
        continue-on-error: true

      # ========================================
      # Postman/Newman Tests (Phase 0 carry-over)
      # ========================================
      - name: Install Newman (Postman CLI)
        run: npm install -g newman newman-reporter-htmlextra

      - name: Run Postman collection tests
        run: |
          node src/blog/server.js &
          SERVER_PID=$!
          sleep 5
          newman run docs/blog-posts-api.postman_collection.json \
            --environment <(echo '{"id":"test-env","name":"Test","values":[{"key":"baseUrl","value":"http://localhost:3000","enabled":true}]}') \
            --reporters cli,json,htmlextra \
            --reporter-json-export review-packet/postman-results.json \
            --reporter-htmlextra-export review-packet/postman-report.html \
            --color on \
            || echo "Postman tests completed with issues"
          kill $SERVER_PID 2>/dev/null || true
        continue-on-error: true

      - name: Generate Postman summary
        run: |
          if [ -f review-packet/postman-results.json ]; then
            echo "# Postman Test Results (Phase 0 Carry-over)" > review-packet/postman-summary.md
            echo "" >> review-packet/postman-summary.md
            echo "**Collection**: Blog Posts API" >> review-packet/postman-summary.md
            echo "**Date**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> review-packet/postman-summary.md
            echo "" >> review-packet/postman-summary.md
            node -e "
              const fs = require('fs');
              const results = JSON.parse(fs.readFileSync('review-packet/postman-results.json', 'utf8'));
              const run = results.run;
              console.log('## Summary\n');
              console.log('- Total Requests: ' + run.stats.requests.total);
              console.log('- Assertions: ' + run.stats.assertions.total);
              console.log('- Failed Assertions: ' + run.stats.assertions.failed);
              console.log('- Test Scripts: ' + run.stats.testScripts.total);
              console.log('- Failed Tests: ' + run.stats.testScripts.failed);
              console.log('\n## Status: ' + (run.stats.assertions.failed === 0 ? '✅ All tests passed' : '❌ Some tests failed'));
            " >> review-packet/postman-summary.md
            echo "" >> review-packet/postman-summary.md
            echo "See \`postman-report.html\` for detailed results." >> review-packet/postman-summary.md
          else
            echo "⚠️ Postman results not generated" > review-packet/postman-summary.md
          fi
        continue-on-error: true

      # ========================================
      # Documentation & Git Info
      # ========================================
      - name: Copy documentation
        run: |
          if [ -d docs ]; then
            cp -r docs/* review-packet/
          else
            echo "Warning: docs directory does not exist."
          fi
          if [ -d specs ]; then
            cp -r specs review-packet/
          else
            echo "Warning: specs directory does not exist."
          fi
          cp README.md review-packet/ 2>/dev/null || true
          cp frontend/README.md review-packet/frontend-README.md 2>/dev/null || true

      - name: Capture git log
        run: |
          git log --oneline --graph --all -20 > review-packet/git-log.txt

      - name: Capture branch info
        run: |
          echo "Branch: $(git branch --show-current)" > review-packet/branch-info.txt
          echo "Commit: $(git rev-parse HEAD)" >> review-packet/branch-info.txt
          echo "Author: $(git log -1 --pretty=format:'%an <%ae>')" >> review-packet/branch-info.txt
          echo "Date: $(git log -1 --pretty=format:'%ad')" >> review-packet/branch-info.txt

      - name: List changed files
        run: |
          git diff --name-only $(git merge-base origin/development HEAD)...HEAD > review-packet/changed-files.txt 2>/dev/null || git diff --name-only $(git rev-list --max-parents=0 HEAD)...HEAD > review-packet/changed-files.txt

      # ========================================
      # Generate Frontend Review Packet
      # ========================================
      - name: Create Frontend Review Packet Summary
        run: |
          cat << EOF > review-packet/FRONTEND_REVIEW_PACKET.md
          # Frontend Review Packet
          
          **Branch**: $(git branch --show-current)
          **Commit**: $(git rev-parse --short HEAD)
          **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ---
          
          ## 📋 Spec Reference
          
          - [spec.md](./specs/003-frontend-blog-integration/spec.md) - User stories, acceptance criteria, a11y, error UX, risks, Next.js constraints
          - [plan.md](./specs/003-frontend-blog-integration/plan.md) - Implementation plan
          - [data-model.md](./specs/003-frontend-blog-integration/data-model.md) - Data model documentation
          
          ---
          
          ## ✅ Quality Gates Checklist
          
          ### Next.js Quality Bars
          - [ ] \`next build\` passes with no React/Next warnings
          - [ ] TypeScript type-check passes with no errors
          - [ ] \`NEXT_PUBLIC_API_URL\` is documented and used
          - [ ] URLs remain shareable via searchParams
          
          ### Functionality
          - [ ] Frontend lists posts from the API
          - [ ] User can create a post and see it update
          - [ ] Empty state displays correctly
          - [ ] Loading state displays correctly
          - [ ] Error state displays correctly
          
          ### A11y Requirements
          - [ ] Labeled controls (all form inputs have labels)
          - [ ] Predictable focus after actions
          - [ ] \`aria-live\` or \`role="status"\` for dynamic messages
          - [ ] Playwright a11y smoke tests pass
          
          ### Coverage Requirements
          - [ ] Integration/UI modules ≥50% statements
          - [ ] No critical module below 45%
          
          ### Contract Discipline
          - [ ] API contract tests pass in CI
          - [ ] Any integration break updates spec.md + plan.md
          
          ### Phase 0 Carry-over
          - [ ] Postman collection assertion fixes merged and green
          
          ---
          
          ## 📊 Test Results & Evidence
          
          ### Coverage Summary
          EOF
          cat review-packet/coverage-summary.md >> review-packet/FRONTEND_REVIEW_PACKET.md || echo "Coverage data not available" >> review-packet/FRONTEND_REVIEW_PACKET.md
          
          cat << 'EOF' >> review-packet/FRONTEND_REVIEW_PACKET.md
          
          ### Integration Test Output
          ```
          EOF
          head -100 review-packet/integration-test-output.txt >> review-packet/FRONTEND_REVIEW_PACKET.md 2>/dev/null || echo "No integration test output" >> review-packet/FRONTEND_REVIEW_PACKET.md
          echo '```' >> review-packet/FRONTEND_REVIEW_PACKET.md
          
          cat << 'EOF' >> review-packet/FRONTEND_REVIEW_PACKET.md
          
          ### Contract Test Output
          ```
          EOF
          head -100 review-packet/contract-test-output.txt >> review-packet/FRONTEND_REVIEW_PACKET.md 2>/dev/null || echo "No contract test output" >> review-packet/FRONTEND_REVIEW_PACKET.md
          echo '```' >> review-packet/FRONTEND_REVIEW_PACKET.md
          
          cat << 'EOF' >> review-packet/FRONTEND_REVIEW_PACKET.md
          
          ### A11y Test Output
          ```
          EOF
          head -50 review-packet/a11y-test-output.txt >> review-packet/FRONTEND_REVIEW_PACKET.md 2>/dev/null || echo "No a11y test output" >> review-packet/FRONTEND_REVIEW_PACKET.md
          echo '```' >> review-packet/FRONTEND_REVIEW_PACKET.md
          
          cat << 'EOF' >> review-packet/FRONTEND_REVIEW_PACKET.md
          
          ---
          
          ## 📸 Screenshots
          
          Screenshots of UI states are in the `screenshots/` folder:
          - `empty-state.png` - Empty posts list
          - `loading-state.png` - Loading indicator
          - `error-state.png` - Error handling UI
          - `success-state.png` - Successful post creation
          
          ---
          
          ## 🔗 Links
          
          - [Contract Tests](./contract-test-output.txt)
          - [Postman Report](./postman-report.html)
          - [Coverage Report](./coverage/frontend/index.html)
          - [Playwright Report](./playwright-report/index.html)
          - [Frontend README - Run & Try](./frontend-README.md)
          
          ---
          
          ## 🚀 Deploy Documentation
          
          **Deployment Method**: Vercel SSR / Pages static export
          
          See `frontend/README.md` for:
          - Local development setup
          - Environment variables (`NEXT_PUBLIC_API_URL`)
          - Build and deploy instructions
          - Live demo link
          
          ---
          
          ## 📦 Artifact Contents
          
          - `coverage/` - Code coverage reports (backend + frontend)
          - `screenshots/` - UI state screenshots
          - `playwright-report/` - Playwright test report
          - `coverage-summary.md` - Coverage summary
          - `integration-test-output.txt` - Integration test results
          - `contract-test-output.txt` - Contract test results
          - `a11y-test-output.txt` - Accessibility test results
          - `postman-report.html` - Postman collection test report
          - `postman-summary.md` - Postman test summary
          - `specs/` - Specification documents
          
          EOF

      - name: Create legacy summary (for backward compatibility)
        run: |
          cat << EOF > review-packet/SUMMARY.md
          # Review Packet Summary
          
          **Branch**: $(git branch --show-current)
          **Commit**: $(git rev-parse --short HEAD)
          **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          
          ## Contents
          
          - \`FRONTEND_REVIEW_PACKET.md\` - **Frontend-specific review packet**
          - \`docs/\` - All documentation and review packets
          - \`coverage/\` - Code coverage reports
          - \`screenshots/\` - UI state screenshots
          - \`specs/\` - Specification documents
          - \`postman-report.html\` - Postman test report
          - \`git-log.txt\` - Recent git history
          - \`branch-info.txt\` - Branch and commit details
          - \`changed-files.txt\` - Files modified in this branch
          
          ## Quick Links
          
          - Repository: ${{ github.server_url }}/${{ github.repository }}
          - Branch: ${{ github.server_url }}/${{ github.repository }}/tree/${{ github.ref_name }}
          - CI Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF

      - name: Upload Review Packet
        uses: actions/upload-artifact@v4
        with:
          name: review-packet-${{ github.run_id }}-${{ github.run_number }}
          path: review-packet/
          retention-days: 30

      - name: Comment PR with Review Packet Summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = '';
            try {
              summary = fs.readFileSync('review-packet/FRONTEND_REVIEW_PACKET.md', 'utf8');
              // Truncate if too long for PR comment
              if (summary.length > 60000) {
                summary = summary.substring(0, 60000) + '\n\n... (truncated, see full artifact)';
              }
            } catch (e) {
              summary = '⚠️ Review packet generation failed. Check workflow logs.';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 📦 Frontend Review Packet\n\n${summary}\n\n---\n📎 Full artifacts available in the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).`
            });
