name: checks
on:
  pull_request:
    branches: [ development ]
jobs:
  ci:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install build dependencies for native modules
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test
      - name: Start Blog API Server
        run: npm run dev &
        env:
          NODE_ENV: test
      - name: Wait for Server
        run: npx wait-on http://localhost:3000/health -t 60000
      - name: Run Postman Collection with Newman
        run: npx newman run docs/blog-posts-api.postman_collection.json --env-var baseUrl=http://localhost:3000

  # Non-gating benchmark job: 100 reads + 20 writes at concurrency 5
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-gating: failures don't block PR
    needs: ci  # Run after CI passes
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - name: Install build dependencies for native modules
        run: sudo apt-get update && sudo apt-get install -y build-essential python3
      - run: npm ci
      - name: Start Blog API Server
        run: npm run dev &
        env:
          NODE_ENV: test
      - name: Wait for Server
        run: npx wait-on http://localhost:3000/health -t 60000
      - name: Run API Benchmark (100 reads + 20 writes @ c=5)
        run: node scripts/bench.mjs --base-url=http://localhost:3000
        env:
          API_BASE_URL: http://localhost:3000