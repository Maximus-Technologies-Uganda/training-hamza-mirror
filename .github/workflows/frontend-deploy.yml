# GitHub Actions Workflow: Frontend Build & Deploy
# Builds the Next.js frontend and deploys to GitHub Pages
#
# Triggers:
# - Push to main/development branch with frontend/ changes
# - Pull requests affecting frontend/
# - Manual workflow dispatch
#
# Jobs:
# 1. CI: Type-check, lint, test, build
# 2. CD: Deploy to GitHub Pages (main branch only)

name: Frontend Build & Deploy

on:
  push:
    branches: [main, development]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  pull_request:
    branches: [main, development]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # CI Job: Build and Test
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: TypeScript type-check
        run: npm run type-check
      
      - name: Lint code
        run: npm run lint
      
      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true
      
      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3000' }}
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          # Upload Next.js build output (requires Node.js server for deployment)
          path: frontend/.next
          retention-days: 1
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: frontend/coverage
          retention-days: 7

  # CD Job: Deploy (main branch only)
  # Note: This app uses API routes (BFF pattern) which require a Node.js server.
  # GitHub Pages only supports static sites, so deployment needs a server platform
  # like Vercel, Railway, Render, or a container-based deployment.
  deploy:
    name: Deploy (Server Required)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: ./.next
      
      - name: Deployment Notice
        run: |
          echo "📦 Build artifacts ready for deployment"
          echo "========================================"
          echo ""
          echo "This Next.js app uses API routes (BFF pattern) and requires"
          echo "a Node.js server runtime. It cannot be deployed to GitHub Pages."
          echo ""
          echo "Recommended deployment options:"
          echo "  - Vercel (recommended for Next.js)"
          echo "  - Railway"
          echo "  - Render"
          echo "  - Docker container deployment"
          echo ""
          echo "Build artifacts are available in the 'frontend-build' artifact."

  # Quality Gates (optional metrics reporting)
  quality-check:
    name: Quality Gates
    needs: build
    runs-on: ubuntu-latest
    if: always() && needs.build.result == 'success'
    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next
        continue-on-error: true
      
      - name: Check bundle size
        run: |
          echo "📊 Bundle Size Analysis"
          echo "========================"
          
          # Check if .next/static exists
          if [ ! -d ".next/static" ]; then
            echo "⚠️ Build artifacts not found - skipping bundle size check"
            exit 0
          fi
          
          # Calculate total size of JS and CSS files from the Next.js build output
          TOTAL_SIZE=$(find .next/static -type f \( -name "*.js" -o -name "*.css" \) -exec du -cb {} + | tail -1 | cut -f1)
          TOTAL_KB=$((TOTAL_SIZE / 1024))
          
          echo "Total JS/CSS size: ${TOTAL_KB}KB"
          
          # Check against 500KB limit (uncompressed, compressed will be smaller)
          if [ "$TOTAL_KB" -gt 500 ]; then
            echo "⚠️ Warning: Bundle size exceeds 500KB limit"
            # Not failing for now, as this is uncompressed size
          else
            echo "✅ Bundle size within limit"
          fi
          
          # List largest files
          echo ""
          echo "Largest files:"
          if [ -d ".next/static" ]; then
            find .next/static -type f \( -name "*.js" -o -name "*.css" \) -exec du -h {} + | sort -rh | head -10
          fi
      
      - name: Report test coverage summary
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "📊 Test Coverage Summary"
            echo "========================"
            node -e "
              const coverage = require('./coverage/coverage-summary.json');
              const total = coverage.total;
              console.log('Lines:      ' + total.lines.pct + '%');
              console.log('Functions:  ' + total.functions.pct + '%');
              console.log('Branches:   ' + total.branches.pct + '%');
              console.log('Statements: ' + total.statements.pct + '%');
              
              // Check 70% threshold
              if (total.lines.pct < 70) {
                console.log('⚠️ Warning: Line coverage below 70% target');
                process.exit(1);
              } else {
                console.log('✅ Coverage meets 70% target');
              }
            "
          else
            echo "Coverage report not found"
          fi
