name: Mirror to Public Repository

permissions:
  contents: write

on:
  push:
    branches:
      - development

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MIRROR_PAT }}

      - name: Mirror push to public repository
        env:
          MIRROR_REPO: https://${{ secrets.MIRROR_PAT }}@github.com/Maximus-Technologies-Uganda/training-hamza-mirror.git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git push --force --all "$MIRROR_REPO"
          git push --force --tags "$MIRROR_REPO"